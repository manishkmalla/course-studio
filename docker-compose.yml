services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: course_studio
      POSTGRES_PASSWORD: course_studio
      POSTGRES_DB: course_studio
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_studio -d course_studio"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgres://course_studio:course_studio@db:5432/course_studio
      TEST_DATABASE_URL: postgres://course_studio:course_studio@db:5432/course_studio_test
      JWT_SECRET: dev-only-secret-change-me-please-32chars
      WEB_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - api-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  db-data:
  api-node-modules:
  web-node-modules:
